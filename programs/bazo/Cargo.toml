[package]
name = "bazo"
version = "0.1.0"
description = "Bazo onchain sell-plan protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bazo"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=1.2.0"
anchor-spl = { version = "=1.2.0", features = ["token_2022"] }
solana-sha256-hasher = "=3.1.0"
ethnum = { version = "=1.5.3", default-features = false }
pyth-lazer-solana-contract = { version = "=0.8.0", features = ["no-entrypoint"] }

[dev-dependencies]
serde_json = "1.0"
byteorder = "1.5"
