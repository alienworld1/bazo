[package]
name = "bazo"
version = "0.1.0"
description = "Bazo onchain sell-plan protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bazo"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=1.2.0"
anchor-spl = { version = "=1.2.0", features = ["token_2022"] }
solana-sha256-hasher = "=3.1.0"
